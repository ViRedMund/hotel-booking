[project]
name = "hotel-booking"
version = "0.1.0"
description = "Hotel booking service built with Django"
authors = [
    {name = "RedMund",email = "BlackRedMund@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django (>=6.1.3,<7.0.0)",
    "psycopg[binary] (>=3.3.8,<4.0.0)",
    "pydantic-settings (>=2.16.2,<3.0.0)",
    "djangorestframework (>=3.18.3,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
